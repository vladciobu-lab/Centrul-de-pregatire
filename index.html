<style>
  html { font-size: 112.5%; scroll-behavior: smooth; }
  html[data-size="s"]  { font-size: 106%; }
  html[data-size="m"]  { font-size: 112.5%; }
  html[data-size="l"]  { font-size: 120%; }
  html[data-size="xl"] { font-size: 128%; }
  html, body { background: #FFFFFF; color: #241013; font-family: 'Source Sans 3', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .font-serif { font-family: 'Cormorant Garamond', Georgia, serif; letter-spacing: -0.005em; }
  .serif-h { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; letter-spacing: -0.015em; line-height: 1.05; }

  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: none;
  }

  .flourish { display: inline-flex; align-items: center; gap: 10px; color: #2C6E7F; }
  .flourish::before, .flourish::after {
    content: ''; display: block; width: 36px; height: 1px;
    background: linear-gradient(to right, transparent, currentColor, transparent);
  }

  .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.7s ease, transform 0.7s ease; }
  .reveal.in { opacity: 1; transform: none; }

  .hatched {
    background-color: #FFFFFF;
    background-image: none;
  }

  .nav-link { position: relative; }
  .nav-link::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -6px; height: 2px;
    background: #0A5360; transform: scaleX(0); transform-origin: left; transition: transform 0.25s ease;
  }
  .nav-link:hover::after, .nav-link.active::after { transform: scaleX(1); }

  .wa-pulse::before {
    content:''; position:absolute; inset:0; border-radius:9999px; background: #25D366; opacity: .7;
    animation: pulseRing 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    z-index: -1;
  }

  .input {
    width: 100%; padding: 12px 14px; border: 1px solid #EDDFC2; background: #fff; border-radius: 10px;
    font-size: 16px; color: #241013; transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .input:focus { outline: none; border-color: #2C6E7F; box-shadow: 0 0 0 3px rgba(44,110,127,0.15); }
  .input.error { border-color: #B23A3A; box-shadow: 0 0 0 3px rgba(178,58,58,0.1); }
  label { font-size: 14px; font-weight: 600; color: #241013; display: block; margin-bottom: 6px; }

  .prose-article { max-width: 720px; }
  .prose-article p { margin: 1.1em 0; line-height: 1.8; color: #241013; font-size: 1.0625rem; }
  .prose-article h2 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 1.85rem; margin: 2em 0 0.5em; color: #063944; }
  .prose-article h3 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 1.45rem; margin: 1.5em 0 0.4em; color: #241013; }
  .prose-article ul { margin: 1em 0; padding-left: 1.4em; }
  .prose-article ul li { margin: 0.4em 0; line-height: 1.75; }
  .prose-article ul li::marker { color: #2C6E7F; }
  .prose-article blockquote { border-left: 3px solid #2C6E7F; padding: 0.2em 1em; margin: 1.5em 0; font-style: italic; color: #574749; background: rgba(232,180,188,0.12); }
  .prose-article strong { color: #063944; font-weight: 600; }

  image-slot { background: #F5F1E8; }
  image-slot::part(placeholder) { color: #9C8A8E; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
  #home-sediu { background: transparent; border-radius: 32px; overflow: hidden; }
  #hero-main { border-radius: 24px; overflow: hidden; }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  .tweaks-only { display: none; }
  body.tweaks-on .tweaks-only { display: block; }

  html[data-bg="warm"], html[data-bg="warm"] body { background: #FAF6EE; }
  html[data-bg="warm"] .bg-white { background-color: #FFFCF6; }
  html[data-bg="warm"] .input { background: #FFFCF6; }

  html[data-heading="sans"] .serif-h {
    font-family: 'Source Sans 3', system-ui, sans-serif;
    font-weight: 700; letter-spacing: -0.02em; line-height: 1.12;
  }
  html[data-heading="sans"] .prose-article h2,
  html[data-heading="sans"] .prose-article h3 {
    font-family: 'Source Sans 3', system-ui, sans-serif; font-weight: 700;
  }

  html[data-text="darker"] body { color: #1A0A0D; }
  html[data-text="darker"] .text-ink-muted { color: #3F2F31; }
  html[data-text="darker"] .text-ink-light  { color: #5C4B4E; }
  html[data-text="darker"] .prose-article p { color: #1A0A0D; }
  html[data-text="darker"] p, html[data-text="darker"] li { font-weight: 450; }

  .logo-mask { mix-blend-mode: multiply; }
